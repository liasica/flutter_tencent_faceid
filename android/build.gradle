import java.security.MessageDigest

group 'com.liasica.flutter_tencent_faceid'
version '1.1.1'

String localMavenPath = project.mkdir("build").absolutePath

// 把插件 build 目录下的本地 Maven 仓库注入宿主，供解析腾讯 AAR 坐标
rootProject.allprojects {
    repositories {
        maven { url "file://$localMavenPath" }
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.liasica.flutter_tencent_faceid'
    }

    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 19
        consumerProguardFiles 'kyc-cloud-normal-proguard-rules.pro', 'txkyc-face-consumer-proguard-rules.pro'
    }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:28.0.0'
    // implementation fileTree(include: ['*.aar'], dir: 'libs')
}

// ===== 腾讯 SDK 自动下载 =====
// libs/ 缺少 AAR 时，从宿主应用 pubspec.yaml 的自定义段下载 SDK zip 并解压：
// flutter_tencent_faceid:
//   android_sdk_url: https://example.com/tencent-faceid-sdk-android-<版本>.zip
//   android_sdk_sha256: <可选，zip 的 SHA-256>
// zip 布局约定见插件 README「SDK zip 打包约定」

// 只解析顶层 flutter_tencent_faceid 段下一层的 `key: value`（两空格缩进、
// 纯字符串值），避免依赖构建脚本不可用的 YAML 库
Map readHostSdkConfig() {
    File hostPubspec = new File(rootProject.projectDir, "../pubspec.yaml")
    if (!hostPubspec.isFile()) {
        return [:]
    }
    Map result = [:]
    boolean inSection = false
    hostPubspec.readLines("UTF-8").each { line ->
        if (line ==~ /^flutter_tencent_faceid:\s*(#.*)?$/) {
            inSection = true
            return
        }
        if (!inSection) {
            return
        }
        if (line =~ /^\S/) {
            inSection = false
            return
        }
        def matcher = line =~ /^\s+([A-Za-z0-9_]+):\s*(.+?)(\s+#.*)?$/
        if (matcher) {
            String value = matcher[0][2].trim()
            if (value.length() >= 2 &&
                    ((value.startsWith('"') && value.endsWith('"')) ||
                     (value.startsWith("'") && value.endsWith("'")))) {
                value = value.substring(1, value.length() - 1)
            }
            result[matcher[0][1]] = value
        }
    }
    return result
}

void installTencentSdkIfMissing(File libsDir) {
    File[] existing = libsDir.isDirectory()
            ? libsDir.listFiles({ f -> f.name.endsWith(".aar") } as FileFilter)
            : null
    if (existing != null && existing.length > 0) {
        return
    }

    Map config = readHostSdkConfig()
    String source = config.get("android_sdk_url")?.toString()?.trim()
    if (source == null || source.isEmpty()) {
        // 无宿主 pubspec（独立构建插件模块）时不强制
        if (!new File(rootProject.projectDir, "../pubspec.yaml").isFile()) {
            return
        }
        throw new GradleException(
                "flutter_tencent_faceid: android/libs 缺少腾讯 SDK AAR。" +
                "请在应用 pubspec.yaml 顶层配置 flutter_tencent_faceid.android_sdk_url，" +
                "或按插件 README 手工安装")
    }

    // http(s) 地址下载到临时文件；其余按本地路径处理，相对路径以应用根目录为基准
    File zipFile
    boolean downloaded = false
    if (source ==~ /^https?:\/\/.*/) {
        zipFile = new File(project.mkdir("build").absolutePath as String, "tencent-faceid-sdk-android.zip")
        downloaded = true
        println("flutter_tencent_faceid: 下载腾讯 SDK ${source}")
        URLConnection connection = new URL(source).openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 600000
        connection.inputStream.withCloseable { input ->
            zipFile.withOutputStream { it << input }
        }
    } else {
        zipFile = new File(source)
        if (!zipFile.isAbsolute()) {
            zipFile = new File(rootProject.projectDir.parentFile, source)
        }
        if (!zipFile.isFile()) {
            throw new GradleException("flutter_tencent_faceid: 本地 SDK zip 不存在: ${zipFile.absolutePath}")
        }
        println("flutter_tencent_faceid: 使用本地腾讯 SDK ${zipFile.absolutePath}")
    }

    String expected = config.get("android_sdk_sha256")?.toString()?.trim()
    if (expected) {
        String actual = getFileSHA256(zipFile)
        if (!actual.equalsIgnoreCase(expected)) {
            if (downloaded) {
                zipFile.delete()
            }
            throw new GradleException(
                    "flutter_tencent_faceid: SDK zip 校验失败\n  预期: ${expected}\n  实际: ${actual}")
        }
    }

    project.mkdir(libsDir)
    project.copy {
        from project.zipTree(zipFile)
        include "**/*.aar"
        into libsDir
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
    if (downloaded) {
        zipFile.delete()
    }

    File[] installed = libsDir.listFiles({ f -> f.name.endsWith(".aar") } as FileFilter)
    if (installed == null || installed.length == 0) {
        throw new GradleException("flutter_tencent_faceid: SDK zip 中未找到 AAR，请检查打包布局")
    }
    println("flutter_tencent_faceid: 已安装 ${installed.length} 个 AAR 到 ${libsDir}")
}

String aarPath = localMavenPath
task useAar {
    File file = project.file("libs")
    installTencentSdkIfMissing(file)
    if (file.exists() && file.isDirectory()) {
        file.listFiles(new FileFilter() {
            @Override
            boolean accept(File pathname) {
                return pathname.name.endsWith(".aar")
            }
        }).each { item ->
            String aarName = item.name.substring(0, item.name.length() - 4)
            int firstSeparator = aarName.indexOf("-")
            int lastSeparator = aarName.lastIndexOf("-")
            if (firstSeparator <= 0 || lastSeparator <= firstSeparator + 1 || lastSeparator >= aarName.length() - 1) {
                throw new GradleException("AAR 文件名必须为 group-artifact-version.aar")
            }
            String groupId = aarName.substring(0, firstSeparator)
            String artifactId = aarName.substring(firstSeparator + 1, lastSeparator)
            String version = aarName.substring(lastSeparator + 1)
            String sha1 = getFileSha1(item)
            String md5 = getFileMD5(item)
            println("aar: " + aarName + " file sha1:" + sha1 + " md5:" + md5)
            String fromStr = item.path
            String intoStr = aarPath + "/" + groupId.replace(".", "/") + "/" + artifactId + "/" + version
            String newName = artifactId + "-" + version + ".aar"

            project.copy {
                from fromStr
                into intoStr
                rename(item.name, newName)
            }

            project.file(intoStr + "/" + newName + ".md5").write(md5)
            project.file(intoStr + "/" + newName + ".sha1").write(sha1)

            String pomPath = intoStr + "/" + newName.substring(0, newName.length() - 4) + ".pom"
            project.file(pomPath).write(createPomStr(groupId, artifactId, version))
            project.file(pomPath + ".md5").write(getFileMD5(project.file(pomPath)))
            project.file(pomPath + ".sha1").write(getFileSha1(project.file(pomPath)))

            String metadataPath = project.file(intoStr).getParentFile().path + "/maven-metadata.xml"
            project.file(metadataPath).write(createMetadataStr(groupId, artifactId, version))
            project.file(metadataPath + ".md5").write(getFileMD5(project.file(metadataPath)))
            project.file(metadataPath + ".sha1").write(getFileSha1(project.file(metadataPath)))
            dependencies {
                implementation "${groupId}:${artifactId}:${version}"
            }
        }
    }
}

public static String createMetadataStr(String groupId, String artifactId, String version) {
    return "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n" +
            "<metadata>\n" +
            "  <groupId>$groupId</groupId>\n" +
            "  <artifactId>$artifactId</artifactId>\n" +
            "  <versioning>\n" +
            "    <release>$version</release>\n" +
            "    <versions>\n" +
            "      <version>$version</version>\n" +
            "    </versions>\n" +
            "    <lastUpdated>${new Date().format('yyyyMMdd')}000000</lastUpdated>\n" +
            "  </versioning>\n" +
            "</metadata>\n"
}

public static String createPomStr(String groupId, String artifactId, String version) {
    return "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n" +
            "<project xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\" xmlns=\"http://maven.apache.org/POM/4.0.0\"\n" +
            "    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\">\n" +
            "  <modelVersion>4.0.0</modelVersion>\n" +
            "  <groupId>$groupId</groupId>\n" +
            "  <artifactId>$artifactId</artifactId>\n" +
            "  <version>$version</version>\n" +
            "  <packaging>aar</packaging>\n" +
            "</project>\n"
}

// 计算文件摘要并按位数左补零
public static String fileDigest(File file, String algorithm, int hexLength) {
    FileInputStream input = null
    try {
        input = new FileInputStream(file)
        MessageDigest digest = MessageDigest.getInstance(algorithm)
        byte[] buffer = new byte[1024 * 1024 * 10]
        int len = 0
        while ((len = input.read(buffer)) > 0) {
            digest.update(buffer, 0, len)
        }
        String value = new BigInteger(1, digest.digest()).toString(16)
        while (value.length() < hexLength) {
            value = "0" + value
        }
        return value
    } finally {
        if (input != null) {
            input.close()
        }
    }
}

public static String getFileSha1(File file) {
    return fileDigest(file, "SHA-1", 40)
}

public static String getFileSHA256(File file) {
    return fileDigest(file, "SHA-256", 64)
}

public static String getFileMD5(File file) {
    return fileDigest(file, "MD5", 32)
}
